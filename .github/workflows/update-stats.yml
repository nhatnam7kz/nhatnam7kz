name: Update project stats
on:
  schedule: [{ cron: "0 0 * * *" }]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: update-stats
  cancel-in-progress: false
jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Projects (Marketplace + Releases)
        run: python3 make-projects.py
      - name: GitHub stats
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 make-stats.py
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add projects-ext.svg projects-app.svg github-stats.svg
          git commit -m "chore: update stats" || exit 0
          git pull --rebase
          git push
